name: Shared Release Workflow

# Publishes to npm with trusted publishing (OIDC): no npm token. The calling workflow must grant
# `id-token: write` (plus `contents: write` and `pull-requests: write` for the Version Packages PR),
# and the package needs a trusted publisher on npmjs.com that names the CALLING workflow's filename.
on:
  workflow_call:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: bun release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
